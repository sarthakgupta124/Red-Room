version: '3.8'

services:
  # Redis for state management
  redis:
    image: redis:7-alpine
    container_name: redroom-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # PostgreSQL for persistent storage
  postgres:
    image: postgres:15-alpine
    container_name: redroom-postgres
    environment:
      POSTGRES_DB: redroom
      POSTGRES_USER: redroom
      POSTGRES_PASSWORD: redroom_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redroom"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Orchestrator
  orchestrator:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.orchestrator
    container_name: redroom-orchestrator
    depends_on:
      - redis
      - postgres
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://redroom:redroom_password@postgres:5432/redroom
      - LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./models:/models
      - /var/run/docker.sock:/var/run/docker.sock
    command: uvicorn redroom.orchestrator.main:app --host 0.0.0.0 --port 8000 --reload

  # Demo Fintech Application
  demo-fintech:
    build:
      context: ./src/demo/fintech_app
      dockerfile: Dockerfile
    container_name: demo-fintech
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=sqlite:///./fintech.db
      - ENABLE_VULNERABILITY=true
    volumes:
      - demo-data:/app/data
    command: uvicorn app:app --host 0.0.0.0 --port 8080

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: redroom-jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411

volumes:
  redis-data:
  postgres-data:
  demo-data:

networks:
  default:
    name: redroom-network
